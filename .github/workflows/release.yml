name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build BAKIR-T-T Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Format check
        working-directory: bakir-t-t
        run: cargo fmt --check

      - name: Check
        working-directory: bakir-t-t
        run: cargo check

      - name: Build release
        working-directory: bakir-t-t
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p "dist/bakir-t-t-${VERSION}-linux-x86_64"
          cp "bakir-t-t/target/x86_64-unknown-linux-musl/release/bakir-t-t" \
             "dist/bakir-t-t-${VERSION}-linux-x86_64/"
          chmod +x "dist/bakir-t-t-${VERSION}-linux-x86_64/bakir-t-t"

          cat > "dist/bakir-t-t-${VERSION}-linux-x86_64/README.txt" <<'README'
BAKIR-T-T
BAKIR Terminal Theme

Linux x86_64 release.

Run:
    ./bakir-t-t status

Install:
    ./bakir-t-t install

Uninstall:
    ./bakir-t-t uninstall
README

          cd "dist/bakir-t-t-${VERSION}-linux-x86_64"
          sha256sum bakir-t-t > SHA256SUMS.txt
          cd ../..
          tar -czf \
            "dist/bakir-t-t-${VERSION}-linux-x86_64.tar.gz" \
            -C dist "bakir-t-t-${VERSION}-linux-x86_64"

      - name: Verify package
        run: |
          tar -tzf "dist/bakir-t-t-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          test -x "bakir-t-t/target/x86_64-unknown-linux-musl/release/bakir-t-t"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/bakir-t-t-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
            --title "BAKIR-T-T ${GITHUB_REF_NAME}" \
            --generate-notes
