name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build BAKIR-T-T Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Format check
        working-directory: bakir-t-t
        run: cargo fmt --check

      - name: Check
        working-directory: bakir-t-t
        run: cargo check

      - name: Build release
        working-directory: bakir-t-t
        run: cargo build --release

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PACKAGE="bakir-t-t-${VERSION}-linux-x86_64"
          mkdir -p "dist/${PACKAGE}"

          cp "bakir-t-t/target/release/bakir-t-t" \
             "dist/${PACKAGE}/bakir-t-t"

          chmod +x "dist/${PACKAGE}/bakir-t-t"

          cat > "dist/${PACKAGE}/README.txt" <<'README'
BAKIR-T-T
BAKIR Terminal Theme

Linux x86_64 release.

Run:
    ./bakir-t-t status

Install:
    ./bakir-t-t install

Uninstall:
    ./bakir-t-t uninstall
README

          cd "dist/${PACKAGE}"
          sha256sum bakir-t-t > SHA256SUMS.txt
          cd ../..

          tar -czf \
            "dist/${PACKAGE}.tar.gz" \
            -C dist "${PACKAGE}"

      - name: Verify package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PACKAGE="bakir-t-t-${VERSION}-linux-x86_64"

          test -f "dist/${PACKAGE}.tar.gz"
          tar -tzf "dist/${PACKAGE}.tar.gz"
          test -x "dist/${PACKAGE}/bakir-t-t"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"

          gh release create "${VERSION}" \
            "dist/bakir-t-t-${VERSION}-linux-x86_64.tar.gz" \
            --title "BAKIR-T-T ${VERSION}" \
            --generate-notes
